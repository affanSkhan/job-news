name: RolePilot Database Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: rolepilot-db-maintenance
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest public catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download current runtime catalog
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/affanSkhan/job-news/rolepilot-runtime-cache/data/public-jobs.json \
            -o data/public-jobs.json
          test -s data/public-jobs.json

      - name: Sync public catalog to secondary Neon
        run: node scripts/sync-public-catalog.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
