name: Normalize hero asset

on:
  push:
    branches: [main]
    paths:
      - "public/ChatGPT Image Sep 21, 2026, 11_39_49 PM.png"
      - ".github/workflows/normalize-hero-asset.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stable hero filename
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "public/rolepilot-hero.png" ]; then
            echo "Stable hero asset already exists."
            exit 0
          fi

          test -f "public/ChatGPT Image Sep 21, 2026, 11_39_49 PM.png"
          cp "public/ChatGPT Image Sep 21, 2026, 11_39_49 PM.png" "public/rolepilot-hero.png"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/rolepilot-hero.png"
          git commit -m "chore: add stable hero asset"
          git push origin HEAD:main
