name: RolePilot Catalog Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"

permissions:
  contents: read

concurrency:
  group: rolepilot-catalog-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify public catalog
        run: |
          test -s data/public-jobs.json
          node --input-type=module -e 'const fs=require("node:fs"); const j=JSON.parse(fs.readFileSync("data/public-jobs.json","utf8")); if(!Array.isArray(j)||j.length<100) process.exit(1); console.log("Catalog rows:",j.length)'

      - name: Archive catalog
        uses: actions/upload-artifact@v4
        with:
          name: rolepilot-public-catalog-${{ github.run_id }}
          path: |
            data/public-jobs.json
            data/public-jobs-meta.json
          retention-days: 7
          compression-level: 9
