name: RolePilot Catalog Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-backup.yml"
      - "scripts/backup-public-catalog.mjs"
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

concurrency:
  group: rolepilot-catalog-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Backup public job catalog
        run: node scripts/backup-public-catalog.mjs
        env:
          DATABASE_URL_BACKUP: ${{ secrets.DATABASE_URL_BACKUP }}
