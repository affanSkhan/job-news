name: RolePilot Live HTTP Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-http-probe.yml"

# Final quality-mix verification trigger.

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prove runtime catalog is newer than bundled catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 90 \
            "https://raw.githubusercontent.com/affanSkhan/job-news/rolepilot-runtime-cache/data/public-jobs.json?probe=$(date +%s)" \
            -o /tmp/runtime.json

          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 20 \
            "https://jobs.affan.tech/api/health?probe=$(date +%s)" \
            -o /tmp/health.json

          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            "https://jobs.affan.tech/jobs?probe=$(date +%s)" \
            -o /tmp/live.html

          python3 - <<'PY'
          import json,re,html
          from pathlib import Path
          runtime=json.loads(Path("/tmp/runtime.json").read_text())
          health=json.loads(Path("/tmp/health.json").read_text())
          page=html.unescape(Path("/tmp/live.html").read_text(encoding="utf-8",errors="ignore"))
          titles=re.findall(r'class="title"[^>]*>\s*<a[^>]*>(.*?)</a>',page,re.S|re.I)
          titles=[re.sub(r"<[^>]+>","",t).strip() for t in titles]
          runtime_count=len(runtime)
          active=int(health.get("activeJobs",0))
          expected=runtime[0].get("title","") if runtime else ""
          print("RUNTIME_COUNT=",runtime_count)
          print("ACTIVE_JOBS=",active)
          print("RUNTIME_TOP_TITLE=",expected)
          print("LIVE_TOP_TITLE=",titles[0] if titles else "")
          print("LIVE_LAST_RUN=",((health.get("lastRun") or {}).get("started_at")))
          assert runtime_count >= 300, "Runtime catalog unexpectedly small"
          assert active == runtime_count, f"Health count {active} != runtime count {runtime_count}"
          assert titles, "No live job cards detected"
          runtime_titles={j.get("title","") for j in runtime[:50]}
          assert any(t in runtime_titles for t in titles[:10]), "Live job cards do not overlap the current runtime catalog"
          PY

          echo "LIVE_PRODUCTION_VERIFIED=1"
