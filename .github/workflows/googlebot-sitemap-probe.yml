name: Googlebot Sitemap Probe

on:
  push:
    branches: ["diagnostic/googlebot-sitemap-2026-09-25"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe as Googlebot
        run: |
          set -e
          curl -sS -o /tmp/sitemap.xml -D /tmp/headers.txt --max-time 90 --connect-timeout 15 --retry 2 --retry-all-errors -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" https://jobs.affan.tech/sitemap.xml
          cat /tmp/headers.txt
          wc -c /tmp/sitemap.xml
          python - <<'PY'
from pathlib import Path
import xml.etree.ElementTree as ET
root=ET.fromstring(Path('/tmp/sitemap.xml').read_bytes())
print("XML_OK", root.tag, "URL_COUNT", len(root))
PY
