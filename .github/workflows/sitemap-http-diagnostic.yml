name: Sitemap HTTP Diagnostic

on:
  push:
    branches: ["diagnostic/sitemap-http-2026-09-25"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repeated sitemap probes
        run: |
          set -e
          for i in 1 2 3 4 5; do
            echo "=== PROBE $i ==="
            curl -sS -o /tmp/sitemap.xml -D /tmp/headers.txt --max-time 60 --connect-timeout 15 --retry 2 --retry-all-errors https://jobs.affan.tech/sitemap.xml
            grep -E 'HTTP/|content-type:|server:|x-render-origin-server:|cf-cache-status:' /tmp/headers.txt || true
            python - <<'PY'
from pathlib import Path
import xml.etree.ElementTree as ET
root=ET.fromstring(Path('/tmp/sitemap.xml').read_bytes())
print("XML_OK", root.tag, "URL_COUNT", len(root), "BYTES", Path('/tmp/sitemap.xml').stat().st_size)
PY
          done
      - name: Robots
        run: |
          curl -sS --max-time 30 --connect-timeout 10 --retry 2 --retry-all-errors -D /tmp/robots-headers.txt https://jobs.affan.tech/robots.txt -o /tmp/robots.txt
          grep -E 'HTTP/|content-type:|x-nextjs-cache:|x-render-origin-server:' /tmp/robots-headers.txt || true
          cat /tmp/robots.txt
