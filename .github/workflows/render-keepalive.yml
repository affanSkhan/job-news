name: RolePilot Production Keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render homepage
        run: |
          set -euo pipefail

          check_home() {
            curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 45 "https://job-news-prod.onrender.com/" > /tmp/home.html
            test -s /tmp/home.html
            grep -q "Find the right role. Before the crowd." /tmp/home.html
            grep -q "RolePilot" /tmp/home.html
          }

          if check_home; then
            echo "RolePilot homepage is live."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Render is reachable but the new deployment is not live yet; polling for the RolePilot deployment."
            for i in $(seq 1 36); do
              if check_home; then
                echo "RolePilot deployment is live."
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "Timed out waiting for the RolePilot homepage deployment."
                exit 1
              fi
              echo "Waiting for the RolePilot deployment... attempt $i/36"
              sleep 5
            done
          else
            echo "Scheduled homepage check failed."
            exit 1
          fi

          wc -c /tmp/home.html

      - name: Check RolePilot icon
        run: |
          set -euo pipefail

          check_icons() {
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 "https://job-news-prod.onrender.com/icon.png" > /tmp/rolepilot-icon.png
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 "https://job-news-prod.onrender.com/apple-icon.png" > /tmp/rolepilot-apple.png
            test -s /tmp/rolepilot-icon.png
            test -s /tmp/rolepilot-apple.png
            python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {"/tmp/rolepilot-icon.png": (192, 192), "/tmp/rolepilot-apple.png": (180, 180)}
          for filename, size in expected.items():
              data = Path(filename).read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), filename
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == size, (filename, (width, height))
              print(f"{filename}: valid {width}x{height} PNG")
          PY
          }

          if check_icons; then
            echo "RolePilot icons are live."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "The new Render deployment is not serving the icon assets yet; polling for the asset rollout."
            for i in $(seq 1 36); do
              if check_icons; then
                echo "RolePilot icon deployment is live."
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "Timed out waiting for the RolePilot icon deployment."
                exit 1
              fi
              echo "Waiting for the RolePilot icon deployment... attempt $i/36"
              sleep 5
            done
          else
            echo "Scheduled icon check failed."
            exit 1
          fi

      - name: Wait for direct-application deployment
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://job-news-prod.onrender.com/" > /tmp/deploy-home.html; then
              if grep -q "RolePilot" /tmp/deploy-home.html && grep -q "Find the right role. Before the crowd." /tmp/deploy-home.html; then
                echo "Direct-application deployment is live."
                exit 0
              fi
            fi
            echo "Waiting for the new deployment... attempt $i/36"
            sleep 5
          done
          echo "Timed out waiting for the direct-application deployment."
          exit 1

      - name: Check Render health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 45 "https://job-news-prod.onrender.com/api/health" > /tmp/health.json
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"databaseReachable":true' /tmp/health.json

      - name: Check deployed PDF parser
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 45 "https://job-news-prod.onrender.com/api/health?check=resume" > /tmp/resume-health.json
          cat /tmp/resume-health.json
          grep -q '"resumeParser":{"ok":true' /tmp/resume-health.json

      - name: Check anonymous PDF resume upload
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          objects = [
              b"1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n",
              b"2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n",
              b"3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj\n",
              b"4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n",
          ]
          stream = (
              b"BT /F1 12 Tf 72 720 Td "
              b"(RolePilot Production Resume Smoke Test) Tj 0 -24 Td "
              b"(Python TypeScript React Next.js FastAPI PostgreSQL Machine Learning) Tj 0 -24 Td "
              b"(Software Engineer Intern anonymous upload validation for the production parser.) Tj ET\n"
          )
          objects.append(
              f"5 0 obj << /Length {len(stream)} >> stream\n".encode() +
              stream +
              b"endstream endobj\n"
          )

          body = b"%PDF-1.4\n"
          offsets = [0]
          for obj in objects:
              offsets.append(len(body))
              body += obj
          xref = len(body)
          body += f"xref\n0 {len(objects)+1}\n0000000000 65535 f \n".encode()
          for offset in offsets[1:]:
              body += f"{offset:010d} 00000 n \n".encode()
          body += f"trailer << /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n".encode()
          Path("/tmp/resume-smoke.pdf").write_bytes(body)
          PY

          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 60             -F "resume=@/tmp/resume-smoke.pdf;type=application/pdf"             "https://job-news-prod.onrender.com/api/resume" > /tmp/resume.json

          cat /tmp/resume.json
          grep -q '"ok":true' /tmp/resume.json
          grep -q '"filename":"resume-smoke.pdf"' /tmp/resume.json
          grep -q '"skills":' /tmp/resume.json
          grep -q '"items":' /tmp/resume.json
          grep -q '"direct_application":true' /tmp/resume.json
          if grep -qi 'remoteok.com\|himalayas.app\|arbeitnow.com\|jobicy.com\|remotive.com\|weworkremotely.com' /tmp/resume.json; then
            echo "Aggregator application URL leaked into primary resume matches."
            exit 1
          fi
