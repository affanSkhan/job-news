name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render homepage
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 5 \
            --retry-max-time 180 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            "https://job-news-prod.onrender.com/" > /tmp/home.html
          test -s /tmp/home.html
          grep -q "Every useful job lead" /tmp/home.html
          wc -c /tmp/home.html

      - name: Check Render health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 5 \
            --retry-max-time 180 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            "https://job-news-prod.onrender.com/api/health" > /tmp/health.json
          cat /tmp/health.json
