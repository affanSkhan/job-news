name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep Render service warm
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            "https://job-news-prod.onrender.com/api/health" > /tmp/health.json
          cat /tmp/health.json
