name: RolePilot Production Keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-keepalive.yml"
      - "app/api/keepalive/route.ts"
  workflow_dispatch:
permissions: {}
env:
  BASE_URL: https://jobs.affan.tech

concurrency:
  group: rolepilot-render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm Render instance
        run: |
          set -euo pipefail

          for attempt in $(seq 1 3); do
            echo "Keepalive attempt $attempt/3"
            if curl --fail --silent --show-error \
              --retry 8 --retry-delay 5 --retry-max-time 120 --retry-all-errors \
              --connect-timeout 10 --max-time 90 \
              "${BASE_URL}/api/keepalive?source=github-actions&t=$(date +%s)" \
              > /tmp/keepalive.json; then
              cat /tmp/keepalive.json
              grep -q '"ok":true' /tmp/keepalive.json
              echo "Render instance is warm and serving requests."
              exit 0
            fi
            sleep 5
          done

          echo "Render keepalive failed after 3 attempts."
          exit 1

      - name: Check Render homepage
        run: |
          set -euo pipefail

          check_home() {
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-max-time 150 --retry-all-errors --connect-timeout 10 --max-time 90 "${BASE_URL}/" > /tmp/home.html
            test -s /tmp/home.html
            grep -q "Find the right role. Before the crowd." /tmp/home.html
            grep -q "RolePilot" /tmp/home.html
          }

          if check_home; then
            echo "RolePilot homepage is live."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Render is reachable but the new deployment is not live yet; polling for the RolePilot deployment."
            for i in $(seq 1 36); do
              if check_home; then
                echo "RolePilot deployment is live."
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "Timed out waiting for the RolePilot homepage deployment."
                exit 1
              fi
              echo "Waiting for the RolePilot deployment... attempt $i/36"
              sleep 5
            done
          else
            echo "Scheduled homepage check failed."
            exit 1
          fi

          wc -c /tmp/home.html

      - name: Check RolePilot icon
        run: |
          set -euo pipefail

          check_icons() {
            curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-max-time 45 --retry-all-errors --connect-timeout 10 --max-time 45 "${BASE_URL}/icon.png" > /tmp/rolepilot-icon.png
            curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-max-time 45 --retry-all-errors --connect-timeout 10 --max-time 45 "${BASE_URL}/apple-icon.png" > /tmp/rolepilot-apple.png
            test -s /tmp/rolepilot-icon.png
            test -s /tmp/rolepilot-apple.png
            python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = {"/tmp/rolepilot-icon.png": (192, 192), "/tmp/rolepilot-apple.png": (192, 192)}
          for filename, size in expected.items():
              data = Path(filename).read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), filename
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == size, (filename, (width, height))
              print(f"{filename}: valid {width}x{height} PNG")
          PY
          }

          if check_icons; then
            echo "RolePilot icons are live."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "The new Render deployment is not serving the icon assets yet; polling for the asset rollout."
            for i in $(seq 1 36); do
              if check_icons; then
                echo "RolePilot icon deployment is live."
                break
              fi
              if [ "$i" -eq 36 ]; then
                echo "Timed out waiting for the RolePilot icon deployment."
                exit 1
              fi
              echo "Waiting for the RolePilot icon deployment... attempt $i/36"
              sleep 5
            done
          else
            echo "Scheduled icon check failed."
            exit 1
          fi

      - name: Audit public RolePilot branding
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          pages=(/ /jobs /india /internships /remote-jobs /companies /skills /locations /about /privacy /disclaimer)
          for path in "${pages[@]}"; do
            echo "Auditing $path"
            curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 45 "${BASE_URL}$path" > /tmp/rolepilot-page.html
            grep -q "RolePilot" /tmp/rolepilot-page.html
            if grep -q "JobNews\|Job News" /tmp/rolepilot-page.html; then
              echo "Legacy JobNews branding found on $path"
              exit 1
            fi
          done
          echo "Public pages use RolePilot branding with no legacy JobNews title."

      - name: Check progressive auth boundaries
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail

          save_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o /tmp/save-auth.json -w "%{http_code}" -X POST -H "content-type: application/json" -d '{"jobId":"__rolepilot_auth_smoke__"}' "${BASE_URL}/api/saved-jobs")
          test "$save_status" = "401"
          grep -qi "unauthorized" /tmp/save-auth.json

          application_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o /tmp/application-auth.json -w "%{http_code}" -X POST -H "content-type: application/json" -d '{"jobId":"__rolepilot_auth_smoke__","status":"applied"}' "${BASE_URL}/api/applications")
          test "$application_status" = "401"
          grep -qi "unauthorized" /tmp/application-auth.json

          echo "Anonymous discovery remains open while account-backed actions return 401 for the client-side auth prompt."

      - name: Check Render health
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 45 "${BASE_URL}/api/health" > /tmp/health.json
          cat /tmp/health.json
          python3 - <<'PY'
          import json

          health = json.load(open("/tmp/health.json"))
          assert health.get("ok") is True, health

          # Public discovery intentionally has a cache fallback. A Neon outage
          # should be reported as degraded without making the entire site look
          # down when the cached job catalog is healthy.
          if not health.get("databaseReachable"):
              active = int(health.get("activeJobs") or 0)
              assert active > 0, health
              print(f"Neon database unavailable; cache fallback is serving {active} active jobs.")
          else:
              print("Database reachable and public health checks are green.")
          PY

      - name: Check deployed PDF parser
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 45 "${BASE_URL}/api/health?check=resume" > /tmp/resume-health.json
          cat /tmp/resume-health.json
          grep -q '"resumeParser":{"ok":true' /tmp/resume-health.json

      - name: Check anonymous PDF resume upload
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          objects = [
              b"1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n",
              b"2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n",
              b"3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >> endobj\n",
              b"4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n",
          ]
          stream = (
              b"BT /F1 12 Tf 72 720 Td "
              b"(RolePilot Production Resume Smoke Test) Tj 0 -24 Td "
              b"(Python TypeScript React Next.js FastAPI PostgreSQL Machine Learning) Tj 0 -24 Td "
              b"(Software Engineer Intern anonymous upload validation for the production parser.) Tj ET\n"
          )
          objects.append(
              f"5 0 obj << /Length {len(stream)} >> stream\n".encode() +
              stream +
              b"endstream endobj\n"
          )

          body = b"%PDF-1.4\n"
          offsets = [0]
          for obj in objects:
              offsets.append(len(body))
              body += obj
          xref = len(body)
          body += f"xref\n0 {len(objects)+1}\n0000000000 65535 f \n".encode()
          for offset in offsets[1:]:
              body += f"{offset:010d} 00000 n \n".encode()
          body += f"trailer << /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n".encode()
          Path("/tmp/resume-smoke.pdf").write_bytes(body)
          PY

          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-max-time 180 --retry-all-errors --connect-timeout 10 --max-time 60             -F "resume=@/tmp/resume-smoke.pdf;type=application/pdf"             "${BASE_URL}/api/resume" > /tmp/resume.json

          cat /tmp/resume.json
          grep -q '"ok":true' /tmp/resume.json
          grep -q '"filename":"resume-smoke.pdf"' /tmp/resume.json
          grep -q '"skills":' /tmp/resume.json
          grep -q '"items":' /tmp/resume.json
          grep -q '"direct_application":true' /tmp/resume.json
          if grep -qi 'remoteok.com\|himalayas.app\|arbeitnow.com\|jobicy.com\|remotive.com\|weworkremotely.com' /tmp/resume.json; then
            echo "Aggregator application URL leaked into primary resume matches."
            exit 1
          fi
