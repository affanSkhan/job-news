name: RolePilot Netlify Git Trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netlify-git-push-trigger.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create a real Git push for Netlify
        shell: bash
        run: |
          set -euo pipefail
          printf 'RolePilot production deployment trigger: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .netlify-deploy-trigger
          git config user.name "RolePilot Deploy Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .netlify-deploy-trigger
          git commit -m "ci: trigger Netlify production deploy [skip ci]"
          git push origin HEAD:main
