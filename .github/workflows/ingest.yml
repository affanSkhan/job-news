name: JobNews Twice-Daily Intelligence Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ingest.yml","package.json","package-lock.json","scripts/**","data/sources.json","supabase/migrations/**"]
  schedule:
    - cron: "0 3,15 * * *"
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-audit --no-fund
      - name: Ingest broad source set
        run: npm run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          LEVER_SITES: ${{ secrets.LEVER_SITES }}
          ASHBY_BOARDS: ${{ secrets.ASHBY_BOARDS }}
      - name: AI enrichment
        run: npm run ai:enrich
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen3-0.6B:fastest
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
      - name: Semantic embeddings
        run: npm run jobs:embed
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
          EMBED_BATCH: 80
      - name: User alerts
        run: npm run alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      - name: Publish cache only when it changed
        run: |
          git config user.name "JobNews Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json package-lock.json
          if git diff --cached --quiet; then echo "No cache changes."; exit 0; fi
          git commit -m "chore: refresh job cache [skip ci]"
          git push