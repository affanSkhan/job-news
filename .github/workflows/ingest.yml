name: JobNews Twice-Daily Intelligence Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ingest.yml","package.json","package-lock.json","scripts/**","data/sources.json","data/ats-sources.json","db/migrations/**"]
  schedule:
    - cron: "30 3,15 * * *"
permissions:
  contents: write
concurrency:
  group: jobnews-intelligence
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install --no-audit --no-fund
      - name: Production build check
        run: npm run build
      - name: Ingest broad source set
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          LEVER_SITES: ${{ secrets.LEVER_SITES }}
          ASHBY_BOARDS: ${{ secrets.ASHBY_BOARDS }}
      - name: AI intelligence enrichment
        run: npm run ai:enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen3-0.6B:fastest
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
          AI_BATCH: 5000
          AI_REWRITE: "1"
          LOCAL_AI_MODEL: Xenova/distilbart-cnn-6-6
          LOCAL_AI_MAX: 20
      - name: Local semantic embeddings
        run: npm run jobs:embed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
          EMBED_BATCH: 5000
          LOCAL_EMBEDDING_MODEL: Xenova/all-MiniLM-L6-v2
      - name: User alerts
        run: npm run alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      - name: Publish cache only when it changed
        run: |
          git config user.name "JobNews Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json package-lock.json
          if git diff --cached --quiet; then echo "No cache changes."; exit 0; fi
          git commit -m "chore: refresh job cache [skip ci]"
          git push
