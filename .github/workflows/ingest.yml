name: RolePilot Radar Intelligence Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "lib/**"
      - "app/**"
      - "data/sources.json"
      - "data/ats-sources.json"
      - "db/migrations/**"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: rolepilot-intelligence
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Transformers.js models
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: rolepilot-transformers-${{ runner.os }}-${{ hashFiles('scripts/ai-enrich.mjs', 'scripts/embed-jobs.mjs', 'package-lock.json') }}
          restore-keys: |
            rolepilot-transformers-${{ runner.os }}-

      - name: Validate hero asset
        run: test -s public/rolepilot-hero.webp

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate ingest script syntax
        run: node --check scripts/ingest.mjs

      - name: Production build check
        if: ${{ github.event_name != 'schedule' }}
        run: npm run build

      - name: Resume and role search regression suite
        if: ${{ github.event_name != 'schedule' }}
        run: npx --yes tsx scripts/test-matching.mjs

      - name: Discover fresh opportunities
        id: ingest
        run: npm run ingest

      - name: Enrich opportunities locally
        if: steps.ingest.outcome == 'success'
        run: npm run ai:enrich
        env:
          AI_BATCH: 20
          AI_REWRITE: "0"
          LOCAL_AI_MODEL: Xenova/distilbart-cnn-6-6
          LOCAL_AI_MAX: 20
          ALLOW_EXTERNAL_AI: "0"

      - name: Validate generated public cache
        if: steps.ingest.outcome == 'success'
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const jobs = JSON.parse(fs.readFileSync("data/public-jobs.json", "utf8"));
          if (!Array.isArray(jobs) || jobs.length < 100) {
            throw new Error("Public cache is unexpectedly small.");
          }
          for (const [index, job] of jobs.entries()) {
            if (!job?.id || !job?.slug || !job?.title || !job?.company || !job?.applyUrl) {
              throw new Error(`Invalid public job at index ${index}`);
            }
          }
          console.log(`Validated ${jobs.length} public jobs.`);
          NODE

      - name: Publish runtime catalog branch
        if: steps.ingest.outcome == 'success'
        run: |
          set -euo pipefail
          test -s data/public-jobs.json
          test -s data/public-jobs-meta.json

          git config user.name "RolePilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/rolepilot-runtime-cache
          cp data/public-jobs.json /tmp/rolepilot-runtime-cache/public-jobs.json
          cp data/public-jobs-meta.json /tmp/rolepilot-runtime-cache/public-jobs-meta.json

          git checkout --orphan rolepilot-runtime-cache
          git rm -rf .
          cp /tmp/rolepilot-runtime-cache/public-jobs.json data/public-jobs.json
          cp /tmp/rolepilot-runtime-cache/public-jobs-meta.json data/public-jobs-meta.json
          git add data/public-jobs.json data/public-jobs-meta.json
          git commit -m "chore: refresh runtime catalog"
          git push --force origin HEAD:rolepilot-runtime-cache

          echo "Published runtime catalog branch."
