name: RolePilot Radar Intelligence Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ingest.yml",".github/workflows/render-keepalive.yml","package.json","package-lock.json","scripts/**","lib/**","app/**","data/**","db/migrations/**"]
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: jobnews-intelligence
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install --no-audit --no-fund
      - name: Validate ingest script syntax
        run: node --check scripts/ingest.mjs
      - name: Production build check
        if: ${{ github.event_name != 'schedule' }}
        run: npm run build
      - name: AI web discovery
        continue-on-error: true
        run: npm run web:discover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WEB_DISCOVERY_MODEL: gpt-5.6
      - name: Discover fresh opportunities
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          LEVER_SITES: ${{ secrets.LEVER_SITES }}
          ASHBY_BOARDS: ${{ secrets.ASHBY_BOARDS }}
      - name: Enrich new opportunities
        run: npm run ai:enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen3-0.6B:fastest
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
          AI_BATCH: 250
          AI_REWRITE: "1"
          LOCAL_AI_MODEL: Xenova/distilbart-cnn-6-6
          LOCAL_AI_MAX: 25
      - name: Refresh semantic indexes
        run: npm run jobs:embed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMBED_BATCH: 300
          LOCAL_EMBEDDING_MODEL: Xenova/all-MiniLM-L6-v2
      - name: Send eligible alerts
        run: npm run alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      - name: Publish dependency lock changes only
        run: |
          git config user.name "RolePilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached -f data/jobs.json 2>/dev/null || true
          git add -u package-lock.json data/jobs.json
          if git diff --cached --quiet; then echo "No repository metadata changes."; exit 0; fi
          git commit -m "chore: refresh repository metadata [skip ci]"
          git push
