name: RolePilot Radar Intelligence Pipeline
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/refresh-now"
  schedule:
    # Twice daily at 9:17 AM and 9:17 PM Asia/Kolkata (12 hours apart).
    - cron: "47 3,15 * * *"

permissions:
  contents: write

concurrency:
  group: rolepilot-intelligence
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard scheduled run by catalog freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled event: run ingestion."
            exit 0
          fi
          META_URL="https://raw.githubusercontent.com/affanSkhan/job-news/rolepilot-runtime-cache/data/public-jobs-meta.json"
          if meta="$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 20 "$META_URL")"; then
            generated_at="$(printf "%s" "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generatedAt",""))')"
            if [ -n "$generated_at" ]; then
              generated_epoch="$(date -d "$generated_at" +%s 2>/dev/null || echo 0)"
              now_epoch="$(date +%s)"
              age=$((now_epoch - generated_epoch))
              if [ "$generated_epoch" -gt 0 ] && [ "$age" -ge 0 ] && [ "$age" -lt 1500 ]; then
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                echo "Runtime catalog is already fresh; skipping this redundant scheduled run."
                exit 0
              fi
            fi
          else
            echo "::warning::Could not read runtime catalog metadata; running ingestion defensively."
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Catalog is stale or unavailable; run ingestion."

      - name: Setup Node 20
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Transformers.js models
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: rolepilot-transformers-${{ runner.os }}-${{ hashFiles('scripts/ai-enrich.mjs', 'scripts/embed-jobs.mjs', 'package-lock.json') }}
          restore-keys: |
            rolepilot-transformers-${{ runner.os }}-

      - name: Validate hero asset
        if: steps.freshness.outputs.should_run == 'true'
        run: test -s public/rolepilot-hero.webp

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Validate ingest script syntax
        if: steps.freshness.outputs.should_run == 'true'
        run: node --check scripts/ingest.mjs

      - name: Production build check
        if: steps.freshness.outputs.should_run == 'true' && github.event_name != 'schedule'
        run: npm run build

      - name: Resume and role search regression suite
        if: steps.freshness.outputs.should_run == 'true' && github.event_name != 'schedule'
        run: npx --yes tsx scripts/test-matching.mjs

      - name: Remove static/demo listings from public feed
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/ats-sources.json")
          sources=json.loads(p.read_text())
          sources=[s for s in sources if s.get("kind") != "static_job"]
          p.write_text(json.dumps(sources,indent=2,ensure_ascii=False)+"\n")
          print("Live ATS source definitions:",len(sources))
          PY

      - name: Discover fresh opportunities
        id: ingest
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run ingest

      - name: Enrich opportunities locally
        if: steps.freshness.outputs.should_run == 'true' && steps.ingest.outcome == 'success'
        run: npm run ai:enrich
        env:
          AI_BATCH: 20
          AI_REWRITE: "0"
          LOCAL_AI_MODEL: Xenova/distilbart-cnn-6-6
          LOCAL_AI_MAX: 20
          ALLOW_EXTERNAL_AI: "0"

      - name: Validate generated public cache
        if: steps.freshness.outputs.should_run == 'true' && steps.ingest.outcome == 'success'
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const jobs = JSON.parse(fs.readFileSync("data/public-jobs.json", "utf8"));
          if (!Array.isArray(jobs) || jobs.length < 100) throw new Error("Public cache is unexpectedly small.");
          for (const [index, job] of jobs.entries()) {
            if (!job?.id || !job?.slug || !job?.title || !job?.company || !job?.applyUrl) throw new Error(`Invalid public job at index ${index}`);
            if (job.sourceKind === "static_job") throw new Error(`Static job leaked into public cache at index ${index}`);
          }
          console.log(`Validated ${jobs.length} live public jobs.`);
          NODE

      - name: Validate India and verified quality mix
        if: steps.freshness.outputs.should_run == 'true' && steps.ingest.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          jobs=json.loads(Path("data/public-jobs.json").read_text())
          terms=("india","bengaluru","bangalore","hyderabad","pune","mumbai","delhi","gurgaon","gurugram","noida","chennai","kolkata","ahmedabad","jaipur","kochi","indore","nagpur")
          verified=sum(bool(j.get("verified")) for j in jobs)
          india=sum(any(t in str(j.get("location","")).lower() for t in terms) for j in jobs)
          fresher=sum(j.get("experience")=="fresher" or j.get("type")=="internship" for j in jobs)
          print(f"QUALITY_MIX total={len(jobs)} verified={verified} india={india} fresher_or_intern={fresher}")
          if any(j.get("sourceKind")=="static_job" for j in jobs):
              raise SystemExit("Static/demo listing leaked into public cache.")
          if len(jobs) < 300:
              raise SystemExit("Quality catalog unexpectedly small.")
          if verified < 100:
              raise SystemExit("Verified-source coverage unexpectedly low.")
          if india < 150:
              raise SystemExit("India coverage unexpectedly low.")

      - name: Publish runtime catalog branch
        if: steps.freshness.outputs.should_run == 'true' && steps.ingest.outcome == 'success'
        run: |
          set -euo pipefail
          test -s data/public-jobs.json
          test -s data/public-jobs-meta.json
          git config user.name "RolePilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/rolepilot-runtime-cache
          cp data/public-jobs.json /tmp/rolepilot-runtime-cache/public-jobs.json
          cp data/public-jobs-meta.json /tmp/rolepilot-runtime-cache/public-jobs-meta.json
          git checkout --orphan rolepilot-runtime-cache
          git rm -rf .
          cp /tmp/rolepilot-runtime-cache/public-jobs.json data/public-jobs.json
          cp /tmp/rolepilot-runtime-cache/public-jobs-meta.json data/public-jobs-meta.json
          git add data/public-jobs.json data/public-jobs-meta.json
          git commit -m "chore: refresh runtime catalog"
          git push --force origin HEAD:rolepilot-runtime-cache
          echo "Published runtime catalog branch."
