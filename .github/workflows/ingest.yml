name: RolePilot Radar Intelligence Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ingest.yml","package.json","package-lock.json","scripts/**","lib/**","app/**","data/**","db/migrations/**"]
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: jobnews-intelligence
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}

      - name: Validate optimized hero asset
        run: test -s public/rolepilot-hero.webp
      - run: npm install --no-audit --no-fund
      - name: Validate ingest script syntax
        run: node --check scripts/ingest.mjs
      - name: Production build check
        if: ${{ github.event_name != 'schedule' }}
        run: npm run build
      - name: Resume and role search regression suite
        if: ${{ github.event_name != 'schedule' }}
        run: npx --yes tsx scripts/test-matching.mjs
      - name: AI web discovery
        continue-on-error: true
        run: npm run web:discover
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WEB_DISCOVERY_MODEL: gpt-5.6
      - name: Discover fresh opportunities
        id: ingest
        continue-on-error: true
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          LEVER_SITES: ${{ secrets.LEVER_SITES }}
          ASHBY_BOARDS: ${{ secrets.ASHBY_BOARDS }}
      - name: Enrich new opportunities
        if: steps.ingest.outcome == 'success'
        run: npm run ai:enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen3-0.6B:fastest
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
          AI_BATCH: 250
          AI_REWRITE: "1"
          LOCAL_AI_MODEL: Xenova/distilbart-cnn-6-6
          LOCAL_AI_MAX: 25
      - name: Refresh semantic indexes
        if: steps.ingest.outcome == 'success'
        run: npm run jobs:embed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMBED_BATCH: 300
          LOCAL_EMBEDDING_MODEL: Xenova/all-MiniLM-L6-v2
      - name: Send eligible alerts
        if: steps.ingest.outcome == 'success'
        run: npm run alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      - name: Report degraded database mode
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::warning::Database sync failed (often due provider quota/network limits). The public JSON cache was still generated from the available sources; DB-backed enrichment, embeddings, and alerts were skipped."

      - name: Publish public job cache
        if: always()
        run: |
          set -euo pipefail
          git config user.name "RolePilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-jobs.json data/public-jobs-meta.json
          git add -u package-lock.json
          if git diff --cached --quiet; then
            echo "No generated cache changes."
            exit 0
          fi

          git commit -m "chore: refresh public job cache [skip ci]"

          # web-discover writes a local artifact that is intentionally not part
          # of the public cache commit. Stash all remaining local changes before
          # rebasing onto main so harmless concurrent deployments cannot block
          # the cache publish.
          git stash push --include-untracked -m "rolepilot-ci-generated" || true

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Published public job cache."
              exit 0
            fi
            echo "Cache publish attempt $attempt failed; retrying..."
            git rebase --abort || true
            git reset --soft origin/main
            git commit -m "chore: refresh public job cache [skip ci]" || true
            sleep 5
          done

          echo "Unable to publish the public job cache after 3 attempts."
          exit 1
