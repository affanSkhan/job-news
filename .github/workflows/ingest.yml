name: JobNews Twice-Daily Ingestion
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/jobs.json"
  schedule:
    - cron: "30 2,14 * * *"
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Ingest
        run: npm run ingest
      - name: AI-enrich
        run: npm run ai:enrich
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: Qwen/Qwen3-0.6B:fastest
      - name: Commit refreshed inventory
        run: |
          git config user.name "JobNews Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh job inventory"
          git push
